name: Publish

description: Publish to Elm registry and create GitHub release

inputs:
  dry-run:
    description: Run in dry-run mode
    required: true
    type: boolean

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: pnpm

    - run: pnpm install
      shell: bash

    - name: Publish to Elm registry
      id: elm-publish
      uses: dillonkearns/elm-publish-action@v2
      with:
        github-token: ${{ inputs.dry-run == false && github.token || '' }}
        path-to-elm: ./node_modules/.bin/elm
        dry-run: ${{ inputs.dry-run }}

    - name: Create GitHub Release
      if: inputs.dry-run == false && success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(jq -r '.version' elm.json)
        gh release create "$VERSION" --generate-notes
      shell: bash
